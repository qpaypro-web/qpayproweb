- paragraph: Preguntas frecuentes
- heading "Todo lo que necesitas saber" [level=2]
- button "¿Qpaypro funciona en Guatemala?":
  - text: ¿Qpaypro funciona en Guatemala?
  - img
- paragraph: Sí, Qpaypro es una pasarela de pagos diseñada para negocios en Guatemala y permite aceptar pagos con tarjeta Visa y Mastercard de forma segura.
- button "¿Puedo cobrar sin tener una tienda en línea?":
  - text: ¿Puedo cobrar sin tener una tienda en línea?
  - img
- paragraph: Sí, puedes enviar links de pago por WhatsApp, Instagram, Facebook o correo electrónico sin necesidad de una tienda en línea.
- button "¿Cuándo se cobra la comisión?":
  - text: ¿Cuándo se cobra la comisión?
  - img
- paragraph: La comisión se descuenta automáticamente de cada transacción exitosa antes de transferir los fondos a tu cuenta bancaria.
- button "¿Cuándo recibo mi dinero?":
  - text: ¿Cuándo recibo mi dinero?
  - img
- paragraph: Los fondos se transfieren a tu cuenta bancaria en un plazo de 24 a 48 horas hábiles después de cada transacción exitosa.
- button "¿Cobran retención de impuestos?":
  - text: ¿Cobran retención de impuestos?
  - img
- paragraph: Sí. Legalmente en Guatemala y El Salvador, a cada transacción con tarjeta de crédito o débito se le descuenta la retención de IVA según el régimen fiscal de cada comercio, y se refleja en cada liquidación.
- button "¿Qué tipo de tienda en línea incluye el plan Premium?":
  - text: ¿Qué tipo de tienda en línea incluye el plan Premium?
  - img
- paragraph: El plan Premium incluye acceso completo a Qpayshop, nuestra plataforma de tienda en línea con capacidad para hasta 100 productos, categorías, métodos de envío y más. Es una solución de eCommerce completa y fácil de usar, similar a Shopify, WooCommerce o Wix.
- button "¿Qué requisitos necesito?":
  - text: ¿Qué requisitos necesito?
  - img
- paragraph: "Los requisitos son sencillos y los de ley: número de identificación tributaria, patente de comercio, estados de cuenta bancarios, documentos de identidad, entre otros. Nuestro equipo de afiliaciones te acompaña en todo el proceso."
- button "¿Con cuáles bancos trabajan?":
  - text: ¿Con cuáles bancos trabajan?
  - img
- paragraph: En Guatemala trabajamos con todos los bancos del sistema y depositamos fondos en cuentas monetarias o de ahorro en GTQ o USD. En El Salvador trabajamos con Banco Atlántida; si no tienes cuenta, te ayudamos a aperturarla durante el proceso de afiliación.
- button "¿Cuánto se tarda en aperturar mi cuenta?":
  - text: ¿Cuánto se tarda en aperturar mi cuenta?
  - img
- paragraph: En Guatemala puedes empezar a cobrar con el plan Free en 5 minutos; tras completar la papelería, la afiliación completa tarda 24 horas hábiles. En El Salvador, el proceso tarda entre 5 y 8 días hábiles incluyendo la cuenta bancaria.
