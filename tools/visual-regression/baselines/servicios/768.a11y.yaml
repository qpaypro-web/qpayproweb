- paragraph: Preguntas frecuentes
- heading "Preguntas frecuentes" [level=2]
- heading "¿Puedo cobrar con tarjeta si no tengo un local?" [level=3]
- paragraph: Sí. Con Qpaypro cobras con tarjeta desde tu celular y envías links de pago por WhatsApp, sin necesidad de un POS físico ni de un local. Ideal para servicios a domicilio.
- heading "¿Cómo cobro mensualidades o servicios frecuentes?" [level=3]
- paragraph: Configuras el cobro automático una sola vez y Qpaypro cobra cada periodo. Así reduces la morosidad y tienes ingresos más predecibles.
- heading "¿Qué comisión cobra Qpaypro?" [level=3]
- paragraph: Las tarifas son claras y sin sorpresas; varían según tu volumen y el método de cobro. Escríbenos y te damos una cotización a tu medida.
- text: 5,000+ Comercios activos 800,000+ Usuarios 24/7 Soporte local
- heading "Lleva tu negocio de servicios al siguiente nivel" [level=2]
- paragraph: Empieza a cobrar con tarjeta, por WhatsApp y con suscripciones hoy mismo con Qpaypro.
