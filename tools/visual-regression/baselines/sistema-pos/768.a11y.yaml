- paragraph: Preguntas frecuentes
- heading "Preguntas frecuentes del Sistema POS" [level=2]
- heading "¿Cómo funciona el POS omnicanal de Qpaypro con las tiendas en línea?" [level=3]
- paragraph: El Sistema POS de Qpaypro sincroniza en tiempo real el inventario, los pagos físicos y la impresión de recibos con las ventas de tu tienda en línea (Shopify, VTEX, WooCommerce), unificando todo en una sola plataforma. Así vendes en el mostrador y en internet con el mismo catálogo y el mismo stock.
- heading "¿Qué incluye el Sistema POS de Qpaypro?" [level=3]
- paragraph: Incluye terminal POS con pantalla táctil, escáner inalámbrico, impresora de recibos y cajón de efectivo. Todo llega listo para vender y cobrar con tarjeta desde el primer día.
- heading "¿El POS acepta pagos con pago sin contacto?" [level=3]
- paragraph: Sí. Acepta Visa y Mastercard, crédito y débito, con pagos pago sin contacto (NFC) y validación 3D Secure para mayor seguridad.
- heading "¿Puedo controlar mi inventario desde el POS?" [level=3]
- paragraph: Sí. El POS controla el stock en tiempo real, envía alertas de bajo inventario y organiza tu catálogo por categorías, sincronizado con tus ventas en línea.
- heading "¿Cuánto cuesta el Sistema POS completo?" [level=3]
- paragraph: El sistema completo tiene un precio de referencia de Q6,845. Escríbenos para una cotización a la medida de tu negocio.
- heading "¿Listo para empezar?" [level=2]
- paragraph: Lleva el Sistema POS a tu negocio y empieza a cobrar, controlar tu inventario y vender desde un solo equipo.
